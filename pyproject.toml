[project]
name = "school-routine-bot"
version = "0.1.0"
description = "Telegram/VK bot for school duty schedule notifications"
authors = [
    { name = "cyber_wi1ch" },
    { name = "fleshofcat" },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httplib2 (>=0.30.0,<0.31.0)",
    "apiclient (>=1.0.4,<2.0.0)",
    "google-api-python-client (>=2.181.0,<3.0.0)",
    "oauth2client (>=4.1.3,<5.0.0)",
    "gspread (>=6.2.1,<7.0.0)",
    "telebot (>=0.0.5,<0.0.6)",
    "telegram (>=0.0.1,<0.0.2)",
    "messagehandler (>=1.0.2,<2.0.0)",
    "aiohttp (>=3.12.15,<4.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "sqlalchemy (>=2.0.47,<3.0.0)",
    "sqlalchemy-data-model-visualizer (>=0.1.3,<0.2.0)",
    "vkbottle (>=4.8.0,<5.0.0)",
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
freezegun = "^1.5.5"
pyfakefs = "^5.10.0"
pytest-mock = "^3.15.1"
types-requests = "^2.33.0.20260712"

[tool.poetry]
packages = [{ include = "school_routine_bot" }]

[tool.isort]
profile = "black"

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "do_not_override_env_file: marker for settings to use a real env file",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
